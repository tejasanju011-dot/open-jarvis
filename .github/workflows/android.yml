
name: Build OpenJarvis APK

on:
  push:
    branches:
      - jarvis-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: open-jarvis-debug-keystore-v1-${{ github.repository }}-${{ github.ref_name }}

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
